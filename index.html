<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine</title>
  <meta name="theme-color" content="#ff2d78" />
  <style>
    :root{
      --bg1:#0b1020; --bg2:#1a0b2e;
      --ring:#ffffff26;
      --txt:#e8eefc; --muted:#b7c1da;
      --yes1:#ff2d78; --yes2:#ff7ab6;
      --no1:#334155; --no2:#1f2937;
      --shadow: 0 24px 70px #0009;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      color:var(--txt);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 700px at 20% 10%, #ff2d7820, transparent 55%),
        radial-gradient(900px 600px at 80% 30%, #7c3aed1c, transparent 60%),
        radial-gradient(900px 700px at 50% 90%, #22c55e12, transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    /* subtle particles */
    .dust{position:fixed; inset:0; pointer-events:none; opacity:.55;}
    .dot{
      position:absolute; width:3px; height:3px; border-radius:999px;
      background:#ffffff20;
      animation: drift linear infinite;
    }
    @keyframes drift{
      from{ transform: translateY(110vh) translateX(0); }
      to{ transform: translateY(-140vh) translateX(var(--dx)); }
    }

    .wrap{
      width:min(860px, 94vw);
      border:1px solid var(--ring);
      border-radius:28px;
      background: linear-gradient(180deg, #0b1220cc, #0b1220a8);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      padding: 26px 20px 18px;
      position:relative;
    }

    /* ===== Envelope view ===== */
    .stage{
      display:grid;
      place-items:center;
      padding: 18px 0 10px;
    }
    .envelope{
      width:min(520px, 92vw);
      height: 320px;
      position:relative;
      border-radius:22px;
      filter: drop-shadow(0 18px 28px #0007);
      cursor:pointer;
      user-select:none;
    }
    .env-body{
      position:absolute; inset:0;
      background: linear-gradient(180deg, #1a2236, #0f172a);
      border:1px solid var(--ring);
      border-radius:22px;
      overflow:hidden;
    }
    .env-liner{
      position:absolute; inset:0;
      background:
        radial-gradient(700px 420px at 30% 20%, #ff2d7816, transparent 60%),
        radial-gradient(700px 420px at 75% 45%, #7c3aed14, transparent 58%),
        linear-gradient(180deg, #0b1220, #0b1220);
      opacity:.9;
    }
    .env-flap{
      position:absolute; left:0; right:0; top:0;
      height: 58%;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: linear-gradient(180deg, #24314f, #121a2e);
      border-bottom:1px solid #ffffff14;
      transform-origin: top center;
    }
    .seal{
      position:absolute;
      left:50%; top:54%;
      transform: translate(-50%,-50%);
      width:66px; height:66px;
      border-radius:999px;
      background: radial-gradient(circle at 30% 30%, #ff7ab6, #ff2d78 55%, #d61b5f);
      box-shadow: 0 14px 30px #ff2d7830, inset 0 2px 10px #ffffff22;
      border:1px solid #ffffff2a;
    }
    .addr{
      position:absolute;
      left:24px; bottom:26px;
      right:24px;
      display:flex;
      justify-content:space-between;
      gap:14px;
      font-weight:800;
      color:#e7ecff;
      opacity:.95;
    }
    .addr span{
      display:block;
      font-weight:700;
      color:#c6d0ee;
      font-size:12px;
      margin-bottom:6px;
      letter-spacing:.08em;
      text-transform:uppercase;
      opacity:.8;
    }
    .addr b{
      display:block;
      font-size:18px;
      letter-spacing:-.01em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 220px;
    }
    .hint{
      margin-top:14px;
      color: var(--muted);
      font-size:14px;
      text-align:center;
      opacity:.95;
    }

    /* ===== Card view (the old vibe, clean) ===== */
    .cardView{
      display:none;
      opacity:0;
      transform: translateY(10px);
      transition: opacity 260ms ease, transform 260ms ease;
      padding: 8px 0 0;
    }
    .card{
      width:min(760px, 92vw);
      border:1px solid var(--ring);
      border-radius:24px;
      padding:26px 22px 22px;
      background: linear-gradient(180deg, #0b1220cc, #0b1220aa);
      box-shadow: 0 18px 50px #0008;
      position:relative;
      margin: 0 auto;
    }
    .title{
      margin:2px 0 16px;
      font-size: clamp(28px, 4.2vw, 44px);
      line-height:1.06;
      letter-spacing:-0.02em;
      text-align:center;
    }
    .panel{
      margin-top:6px;
      padding:18px;
      border-radius:18px;
      border:1px solid var(--ring);
      background:#0b1220a8;
      position:relative;
      overflow:hidden;
    }
    .row{
      display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:center;
      margin-top:10px;
    }
    button{
      border:none; cursor:pointer;
      font-weight:900; letter-spacing:.06em; text-transform:uppercase;
      padding:14px 18px;
      border-radius:14px;
      min-width:170px;
      transition: transform .12s ease, filter .12s ease;
      user-select:none;
    }
    button:active{transform: scale(.98)}
    .yes{
      background: linear-gradient(135deg, var(--yes1), var(--yes2));
      color:white;
      box-shadow: 0 14px 30px #ff2d7830;
    }
    .yes:hover{filter:brightness(1.05)}
    .no{
      background: linear-gradient(135deg, var(--no1), var(--no2));
      color:#e2e8f0;
      box-shadow: 0 14px 26px #0006;
      position:relative;
    }

    .result{
      margin-top:16px;
      display:none;
      text-align:center;
    }
    .result img{
      width:min(520px, 100%);
      border-radius:18px;
      border:1px solid #ffffff26;
      box-shadow: 0 18px 40px #0006;
      opacity:0;
      transform: scale(.985);
      transition: opacity 280ms ease, transform 280ms ease;
    }
    .result.show img{
      opacity:1;
      transform: scale(1);
    }

    .hide{display:none !important;}
  </style>
</head>
<body>
  <div class="dust" id="dust" aria-hidden="true"></div>

  <div class="wrap" id="wrap">
    <!-- Envelope screen -->
    <div class="stage" id="stage">
      <div class="envelope" id="envelope" role="button" aria-label="Open letter" tabindex="0">
        <div class="env-body">
          <div class="env-liner"></div>
          <div class="env-flap"></div>
          <div class="seal" aria-hidden="true"></div>

          <div class="addr">
            <div>
              <span>From</span>
              <b id="fromName">bb</b>
            </div>
            <div style="text-align:right;">
              <span>To</span>
              <b id="toName">bb</b>
            </div>
          </div>
        </div>
      </div>
      <div class="hint">Tap the envelope to open.</div>
    </div>

    <!-- Valentine card screen -->
    <div class="cardView" id="cardView">
      <div class="card">
        <h1 class="title">Will you be my Valentine?</h1>

        <div class="panel" id="panel">
          <div class="row">
            <button class="yes" id="yesBtn">YES</button>
            <button class="no" id="noBtn">NO</button>
          </div>

          <div class="result" id="result">
            <img id="yesImg" src="yes.jpg" alt="Valentine" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // URL params: ?from=bb&to=bb
    const params = new URLSearchParams(location.search);
    const to = (params.get("to") || "bb").trim() || "bb";
    const from = (params.get("from") || "bb").trim() || "bb";
    document.getElementById("toName").textContent = to;
    document.getElementById("fromName").textContent = from;

    // Subtle dust particles
    const dustEl = document.getElementById("dust");
    const dots = 26;
    for (let i=0;i<dots;i++){
      const d = document.createElement("div");
      d.className = "dot";
      d.style.left = (Math.random()*100) + "vw";
      d.style.top = (-Math.random()*120) + "vh";
      const dur = 16 + Math.random()*18;
      d.style.animationDuration = dur + "s";
      d.style.animationDelay = (-Math.random()*dur) + "s";
      d.style.setProperty("--dx", (Math.random()*120 - 60).toFixed(0) + "px");
      d.style.opacity = (0.20 + Math.random()*0.35).toFixed(2);
      dustEl.appendChild(d);
    }

    // Switch screens (no ugly envelope-open animation)
    const stage = document.getElementById("stage");
    const envelope = document.getElementById("envelope");
    const cardView = document.getElementById("cardView");

    function openToCard(){
      stage.classList.add("hide");
      cardView.style.display = "block";
      requestAnimationFrame(() => {
        cardView.style.opacity = "1";
        cardView.style.transform = "translateY(0)";
      });
    }

    envelope.addEventListener("click", openToCard);
    envelope.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") openToCard();
    });

    // YES shows image
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const yesImg = document.getElementById("yesImg");

    // preload image
    const pre = new Image();
    pre.src = yesImg.src;

    yesBtn.addEventListener("click", () => {
      yesBtn.disabled = true;
      noBtn.disabled = true;
      result.style.display = "block";
      requestAnimationFrame(() => result.classList.add("show"));
    });

    // NO button dodge (cute, limited)
    const panel = document.getElementById("panel");
    let noCount = 0;
    const maxDodges = 7;

    function dodge(){
      if (noBtn.disabled) return;
      noCount++;

      const panelRect = panel.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const pad = 14;
      const maxX = Math.max(0, panelRect.width - btnRect.width - pad*2);
      const maxY = 140;

      const x = pad + Math.random() * maxX;
      const y = 64 + Math.random() * Math.max(20, maxY);

      noBtn.style.position = "absolute";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.transform = "rotate(" + ((Math.random()*10)-5).toFixed(0) + "deg)";

      if (noCount >= maxDodges){
        noBtn.removeEventListener("mouseenter", dodge);
      }
    }

    noBtn.addEventListener("mouseenter", dodge);
    noBtn.addEventListener("click", dodge);
  </script>
</body>
</html>
