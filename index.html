<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Valentine?</title>
  <meta name="theme-color" content="#ff3b7a" />
  <style>
    :root{
      --bg1:#0b1020; --bg2:#1a0b2e;
      --card:#0f172aee; --txt:#e8eefc; --muted:#b7c1da;
      --yes1:#ff2d78; --yes2:#ff7ab6;
      --no1:#334155; --no2:#1f2937;
      --ring:#ffffff26;
      --shadow: 0 24px 70px #0009;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      min-height:100svh; /* mobile-friendly viewport */
      display:grid;
      place-items:center;
      color:var(--txt);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:
        radial-gradient(1200px 700px at 20% 10%, #ff2d7826, transparent 55%),
        radial-gradient(900px 600px at 80% 30%, #7c3aed22, transparent 60%),
        radial-gradient(900px 700px at 50% 90%, #22c55e15, transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      overflow:hidden;
      padding:
        max(16px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(16px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
    }

    /* floating hearts background (subtle) */
    .hearts{
      position:fixed; inset:0;
      pointer-events:none;
      opacity:.52;
      filter: drop-shadow(0 8px 18px #0008);
    }
    .heart{
      position:absolute;
      font-size: clamp(14px, 2.5vw, 22px);
      animation: floatUp linear infinite;
      transform: translateY(110vh);
      will-change: transform;
    }
    @keyframes floatUp{
      to { transform: translateY(-140vh) translateX(var(--drift)); }
    }

    /* Full-screen responsive container */
    .wrap{
      width: min(980px, 96vw);
      max-width: 980px;
      border:1px solid var(--ring);
      border-radius: clamp(18px, 3.2vw, 28px);
      background: linear-gradient(180deg, #0b1220cc, #0b1220a8);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
      padding: clamp(16px, 3vw, 26px) clamp(14px, 2.5vw, 20px) clamp(12px, 2.2vw, 18px);
      position:relative;
    }

    /* ===== Envelope screen ===== */
    .stage{
      display:grid;
      place-items:center;
      padding: clamp(10px, 2.4vw, 18px) 0 clamp(6px, 1.8vw, 10px);
    }
    .envelope{
      width: min(560px, 92vw);
      aspect-ratio: 13 / 8;
      max-height: 360px;
      position:relative;
      border-radius: clamp(18px, 3vw, 22px);
      filter: drop-shadow(0 18px 28px #0007);
      cursor:pointer;
      user-select:none;
      outline:none;
      -webkit-tap-highlight-color: transparent;
    }
    .env-body{
      position:absolute; inset:0;
      background: linear-gradient(180deg, #1a2236, #0f172a);
      border:1px solid var(--ring);
      border-radius: inherit;
      overflow:hidden;
    }
    .env-liner{
      position:absolute; inset:0;
      background:
        radial-gradient(700px 420px at 30% 20%, #ff2d7816, transparent 60%),
        radial-gradient(700px 420px at 75% 45%, #7c3aed14, transparent 58%),
        linear-gradient(180deg, #0b1220, #0b1220);
      opacity:.9;
    }
    .env-flap{
      position:absolute; left:0; right:0; top:0;
      height: 58%;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: linear-gradient(180deg, #24314f, #121a2e);
      border-bottom:1px solid #ffffff14;
    }
    .seal{
      position:absolute;
      left:50%; top:54%;
      transform: translate(-50%,-50%);
      width: clamp(52px, 12vw, 66px);
      height: clamp(52px, 12vw, 66px);
      border-radius:999px;
      background: radial-gradient(circle at 30% 30%, #ff7ab6, #ff2d78 55%, #d61b5f);
      box-shadow: 0 14px 30px #ff2d7830, inset 0 2px 10px #ffffff22;
      border:1px solid #ffffff2a;
    }
    .addr{
      position:absolute;
      left: clamp(16px, 4vw, 24px);
      right: clamp(16px, 4vw, 24px);
      bottom: clamp(16px, 4vw, 26px);
      display:flex;
      justify-content:space-between;
      gap:12px;
      font-weight:800;
      color:#e7ecff;
      opacity:.95;
    }
    .addr span{
      display:block;
      font-weight:700;
      color:#c6d0ee;
      font-size: clamp(11px, 2.4vw, 12px);
      margin-bottom:6px;
      letter-spacing:.08em;
      text-transform:uppercase;
      opacity:.85;
    }
    .addr b{
      display:block;
      font-size: clamp(16px, 3.6vw, 18px);
      letter-spacing:-.01em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 48vw;
    }
    .hint{
      margin-top: clamp(10px, 2.4vw, 14px);
      color: var(--muted);
      font-size: clamp(13px, 3vw, 14px);
      text-align:center;
      opacity:.95;
    }

    /* ===== Valentine card ===== */
    .cardView{
      display:none;
      opacity:0;
      transform: translateY(10px);
      transition: opacity 260ms ease, transform 260ms ease;
      padding: 0;
    }
    .card{
      width: min(820px, 92vw);
      border:1px solid var(--ring);
      border-radius: clamp(18px, 3.2vw, 24px);
      padding: clamp(18px, 3.4vw, 28px) clamp(16px, 3vw, 24px) clamp(16px, 2.8vw, 22px);
      background: linear-gradient(180deg, #0b1220cc, #0b1220aa);
      box-shadow: 0 18px 50px #0008;
      position:relative;
      margin: 0 auto;
      overflow:hidden;
    }
    .card::before{
      content:"";
      position:absolute; inset:-2px;
      background:
        radial-gradient(380px 260px at 10% 10%, #ff2d7822, transparent 60%),
        radial-gradient(380px 260px at 90% 15%, #7c3aed20, transparent 60%),
        radial-gradient(420px 320px at 50% 110%, #22c55e14, transparent 60%);
      pointer-events:none;
    }

    .badge{
      position:relative;
      display:inline-flex; align-items:center; gap:10px;
      padding: clamp(9px, 2.4vw, 10px) clamp(12px, 3vw, 14px);
      border-radius:999px;
      border:1px solid var(--ring);
      background:#ffffff0a;
      color:var(--muted);
      font-size: clamp(13px, 3.1vw, 14px);
      margin-bottom: clamp(10px, 2.6vw, 14px);
    }
    .badge b{color:var(--txt)}
    .title{
      position:relative;
      margin:0 0 clamp(8px, 2vw, 10px);
      font-size: clamp(30px, 6.4vw, 46px);
      line-height:1.06;
      letter-spacing:-0.02em;
    }

    .panel{
      position:relative;
      margin-top: clamp(14px, 3vw, 18px);
      padding: clamp(16px, 3.2vw, 18px);
      border-radius: clamp(16px, 3vw, 18px);
      border:1px solid var(--ring);
      background:#0b1220a8;
      overflow:hidden;
      min-height: clamp(200px, 34vw, 240px); /* room for dodging on iPhone */
    }

    .row{
      position:relative;
      display:flex;
      gap: clamp(12px, 3vw, 14px);
      flex-wrap:wrap;
      align-items:center;
      justify-content:center;
      margin-top: clamp(6px, 1.6vw, 10px);
      padding-bottom: 6px;
    }

    button{
      border:none; cursor:pointer;
      font-weight:900; letter-spacing:.06em; text-transform:uppercase;
      padding: clamp(14px, 3.4vw, 14px) clamp(16px, 3.8vw, 18px);
      border-radius: clamp(12px, 3vw, 14px);
      min-width: clamp(148px, 38vw, 190px);
      transition: transform .12s ease, filter .12s ease, opacity .2s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    button:active{transform: scale(.98)}
    .yes{
      background: linear-gradient(135deg, var(--yes1), var(--yes2));
      color:white;
      box-shadow: 0 14px 30px #ff2d7830;
    }
    .yes:hover{filter:brightness(1.06)}
    .no{
      background: linear-gradient(135deg, var(--no1), var(--no2));
      color:#e2e8f0;
      box-shadow: 0 14px 26px #0006;
      position:relative;
      z-index:2;
      touch-action: manipulation;
    }

    .prompt{
      position:relative;
      margin-top: clamp(10px, 2.4vw, 12px);
      text-align:center;
      color:#cbd5e1;
      font-weight:800;
      font-size: clamp(13px, 3.2vw, 14px);
      min-height: 22px;
    }

    .result{
      margin-top: clamp(14px, 3vw, 16px);
      display:none;
      text-align:center;
    }
    .dateTitle{
      font-size: clamp(20px, 5vw, 28px);
      font-weight:950;
      letter-spacing:-0.01em;
      margin: 0 0 clamp(10px, 2.4vw, 12px);
    }
    .result img{
      width:min(560px, 100%);
      max-height: min(60svh, 520px);
      object-fit: cover;
      border-radius: clamp(16px, 3.4vw, 18px);
      border:1px solid #ffffff26;
      box-shadow: 0 18px 40px #0006;
      opacity:0;
      transform: scale(.985);
      transition: opacity 260ms ease, transform 260ms ease;
    }
    .result.show img{
      opacity:1;
      transform: scale(1);
    }

    .hide{display:none !important;}
  </style>
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <div class="wrap">
    <!-- Envelope screen -->
    <div class="stage" id="stage">
      <div class="envelope" id="envelope" role="button" aria-label="Open letter" tabindex="0">
        <div class="env-body">
          <div class="env-liner"></div>
          <div class="env-flap"></div>
          <div class="seal" aria-hidden="true"></div>

          <div class="addr">
            <div>
              <span>From</span>
              <b id="fromName">bb</b>
            </div>
            <div style="text-align:right;">
              <span>To</span>
              <b id="toName">bb</b>
            </div>
          </div>
        </div>
      </div>
      <div class="hint">Tap the envelope to open.</div>
    </div>

    <!-- Valentine card screen -->
    <div class="cardView" id="cardView">
      <div class="card">
        <div class="badge">💌 <span>For</span> <b id="toBadge">bb</b></div>
        <h1 class="title">Will you be my Valentine?</h1>

        <div class="panel" id="panel">
          <div class="row" id="row">
            <button class="yes" id="yesBtn">YES</button>
            <button class="no" id="noBtn">NO</button>
          </div>

          <div class="prompt" id="prompt"></div>

          <div class="result" id="result">
            <div class="dateTitle">It’s date night!</div>
            <img id="yesImg" src="yes.jpg" alt="Valentine" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // URL params: ?from=bb&to=bb
    const params = new URLSearchParams(location.search);
    const to = (params.get("to") || "bb").trim() || "bb";
    const from = (params.get("from") || "bb").trim() || "bb";
    document.getElementById("toName").textContent = to;
    document.getElementById("fromName").textContent = from;
    document.getElementById("toBadge").textContent = to;

    // Floating hearts (subtle)
    const heartsEl = document.getElementById("hearts");
    const heartChars = ["💗","💖","💘","💝","💞","💕","💓","❤️","✨"];
    const count = 18;
    for (let i=0; i<count; i++){
      const s = document.createElement("div");
      s.className = "heart";
      s.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
      const left = Math.random()*100;
      const dur = 12 + Math.random()*16;
      const delay = -Math.random()*dur;
      const drift = (Math.random()*120 - 60).toFixed(0) + "px";
      s.style.left = left + "vw";
      s.style.animationDuration = dur + "s";
      s.style.animationDelay = delay + "s";
      s.style.setProperty("--drift", drift);
      s.style.opacity = (0.18 + Math.random()*0.42).toFixed(2);
      heartsEl.appendChild(s);
    }

    // Screen switch
    const stage = document.getElementById("stage");
    const envelope = document.getElementById("envelope");
    const cardView = document.getElementById("cardView");

    function openToCard(){
      stage.classList.add("hide");
      cardView.style.display = "block";
      requestAnimationFrame(() => {
        cardView.style.opacity = "1";
        cardView.style.transform = "translateY(0)";
      });
    }
    envelope.addEventListener("click", openToCard);
    envelope.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") openToCard();
    });

    // YES shows image + title
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const result = document.getElementById("result");
    const yesImg = document.getElementById("yesImg");
    const promptEl = document.getElementById("prompt");
    const panel = document.getElementById("panel");

    // preload
    const pre = new Image();
    pre.src = yesImg.src;

    yesBtn.addEventListener("click", () => {
      yesBtn.disabled = true;
      noBtn.disabled = true;
      promptEl.textContent = "";
      // keep NO from covering image in odd cases
      noBtn.style.display = "none";
      result.style.display = "block";
      requestAnimationFrame(() => result.classList.add("show"));
    });

    // NO prompts + 5 dodges then shrink away (but stays visible while dodging)
    let noCount = 0;
    const prompts = [
      "Not that one 😌",
      "Try again.",
      "Wrong button.",
      "Nice attempt.",
      "Okay, last chance…"
    ];

    function clamp(val, min, max){ return Math.max(min, Math.min(max, val)); }

    function dodgeOrShrink(){
      if (noBtn.disabled) return;

      if (noCount >= 5){
        promptEl.textContent = "…and it disappeared.";
        noBtn.style.transition = "transform 450ms ease, opacity 450ms ease";
        noBtn.style.transform = "scale(0.02)";
        noBtn.style.opacity = "0";
        setTimeout(() => { noBtn.style.pointerEvents = "none"; }, 460);
        return;
      }

      promptEl.textContent = prompts[noCount] || "Nope.";
      noCount++;

      const panelRect = panel.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // absolute positioning inside panel
      noBtn.style.position = "absolute";

      const padX = 14;
      const padYTop = 76; // keep below the top area of the panel
      const padYBottom = 14;

      const maxX = panelRect.width - btnRect.width - padX;
      const maxY = panelRect.height - btnRect.height - padYBottom;

      // Random positions but clamped so the button is always visible
      let x = padX + Math.random() * Math.max(0, maxX - padX);
      let y = padYTop + Math.random() * Math.max(0, maxY - padYTop);

      x = clamp(x, padX, maxX);
      y = clamp(y, padYTop, maxY);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";

      // small tilt + slight shrink each time (still visible)
      const tilt = ((Math.random()*10)-5).toFixed(0);
      const s = Math.max(0.88, 1 - noCount*0.03);
      noBtn.style.transform = `rotate(${tilt}deg) scale(${s.toFixed(2)})`;
    }

    // works on iPhone (tap + hover-like)
    noBtn.addEventListener("mouseenter", dodgeOrShrink);
    noBtn.addEventListener("click", dodgeOrShrink);
    noBtn.addEventListener("touchstart", dodgeOrShrink, {passive:true});
  </script>
</body>
</html>
